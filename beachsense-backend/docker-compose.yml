version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: beach_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-beach_safety_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beach_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: beach_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_beaches &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: beach_celery_worker
    restart: always
    command: celery -A core worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  celery_beat:
    build: .
    container_name: beach_celery_beat
    restart: always
    command: celery -A core beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis

volumes:
  pgdata: